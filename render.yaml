services:
  - type: web
    name: akhoa-lua-protector
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: akhoa-data
      mountPath: /var/data
      sizeGB: 1
